name: DChat CI

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check environment
        run: |
          node --version
          npm --version
          pwd
          ls -la

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t dchat2969 .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::717728192823:role/GitHubActions-DChat
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image
        run: |
          docker tag dchat2969:latest \
            717728192823.dkr.ecr.ap-south-1.amazonaws.com/dchat2969:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
            717728192823.dkr.ecr.ap-south-1.amazonaws.com/dchat2969:${{ github.sha }}

      - name: Render ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-definition.json
          container-name: Main
          image: 717728192823.dkr.ecr.ap-south-1.amazonaws.com/dchat2969:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: dchat-task-service-9kj6z8iq
          cluster: dchat-cluster
          wait-for-service-stability: true

        
       